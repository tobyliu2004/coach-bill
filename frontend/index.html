    <!-- Social preview. index.html is the whole SPA's entry, so /app and /login
         share this card too: correct here, because the card describes the
         product, not the page. URLs are ABSOLUTE because scrapers don't resolve
         relative ones — which also means *.pages.dev previews point at the
         production image. og.png is generated, not drawn: see
         frontend/src/dev/OgCard.tsx. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://coachbill.fit/" />
    <meta property="og:site_name" content="Coach Bill" />
    <meta property="og:title" content="Coach Bill — the coach who remembers every rep." />
    <meta property="og:description" content="Type one line after you train. Bill logs it, tracks it, and coaches you like he's known you for months — because he has." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The headline &quot;The coach who remembers every rep.&quot; beside a lifter rendered as dense scanlines of monospaced glyphs." />
