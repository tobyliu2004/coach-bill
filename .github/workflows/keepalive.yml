# Keep-alive ping (gap-audit item, July 2026):
# - Supabase Free pauses the whole project after ~7 days without API activity.
# - Render Free spins the service down after 15 min idle.
# One ping to /health/db exercises BOTH (Render serves it; the SELECT 1 touches Supabase).
#
# THIS IS NO LONGER THE PRIMARY KEEP-ALIVE. `worker/keepalive/` is a Cloudflare cron
# that pings every 5 minutes, which is what actually keeps Render warm — a cold
# /health/db measured 32.5s on 2026-09-02, and 4-hourly could never prevent that.
# GitHub's scheduled runners are throttled and routinely fire 10-30 min late, so they
# are structurally unfit to beat a 15-minute idle timeout.
#
# This workflow stays on as the BACKSTOP, and its job is now monitoring rather than
# warming. The Worker rethrows on failure so Cloudflare marks the cron invocation
# failed, but nothing on the free plan EMAILS about that; a red run here does. Keep it
# failing loudly. One caveat on this as a safety net: GitHub disables scheduled
# workflows after 60 days without repository activity, so it protects an active repo
# and quietly stops protecting a dormant one.
#
# ⚠️ COST — read before spinning up anything else free on Render. Warm 24/7 burns
# ~744 of the 750 instance-hours/month in a 31-day month: 0.8% headroom, about SIX
# HOURS. The allowance is per workspace, not per service, and a spun-down service
# consumes none of it — which is precisely what this keep-alive stops happening.
#
# The consequence is not "no second free service". Per Render's docs, consuming the
# 750 hours SUSPENDS ALL FREE WEB SERVICES until the start of the next month. So a
# scratch service left running for one afternoon takes the API down until the 1st,
# and the only fast fix is a credit card. The $7 Starter plan is the clean exit, and
# it makes this Worker redundant rather than wrong.
#   https://render.com/docs/free

name: keepalive

on:
  schedule:
    - cron: "23 */4 * * *" # every 4 hours (:23 to avoid GitHub's congested :00 slot)
  workflow_dispatch: {} # allow manual runs for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db (wakes Render if asleep, keeps Supabase active)
        run: |
          # Render cold start can take ~1 min; retry a few times before declaring failure.
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" -m 120 https://api.coachbill.fit/health/db || echo "000")
            echo "attempt $attempt -> HTTP $code: $(cat /tmp/body)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::health check did not return 200 after 3 attempts"
          exit 1
